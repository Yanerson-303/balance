<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151b31">
  <meta name="description" content="Nexo Vida: controla tus finanzas, agenda, alimentación y notas desde una sola aplicación privada.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Nexo Vida — Tu centro personal</title>
  <script defer src="js/utils.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/finance.js"></script>
  <script defer src="js/planner.js"></script>
  <script defer src="js/nutrition.js"></script>
  <script defer src="js/notes.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Menú principal">
      <div class="brand"><div class="brand-logo">✦</div><div><strong>NEXO<span>VIDA</span></strong><small>Tu espacio integral</small></div></div>
      <div class="nav-caption">TU ESPACIO</div>
      <nav class="side-nav">
        <button type="button" class="nav-item active" data-nav="dashboard"><span class="nav-icon">◫</span> Vista general</button>
        <button type="button" class="nav-item" data-nav="finance"><span class="nav-icon">◈</span> Mis finanzas</button>
        <button type="button" class="nav-item" data-nav="planner"><span class="nav-icon">▦</span> Planificador</button>
        <button type="button" class="nav-item" data-nav="nutrition"><span class="nav-icon">♡</span> Mi alimentación</button>
        <button type="button" class="nav-item" data-nav="notes"><span class="nav-icon">▤</span> Notas y conexiones</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-banner"><span>🔒</span><div><strong>Datos en tu dispositivo</strong><small>Privados, sin cuenta ni servidor.</small></div></div>
        <button type="button" class="nav-item" data-nav="settings"><span class="nav-icon">⚙</span> Ajustes y respaldos</button>
        <div class="side-footer">Nexo Vida · v1.0</div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="page-intro"><span id="eyebrow">TU CENTRO PERSONAL</span><h1 id="page-title">Vista general</h1><div id="page-subtitle">Todo lo que importa, en un mismo lugar.</div></div>
        <div class="top-actions"><div class="today-chip" id="today-chip"></div><button class="icon-button" type="button" title="Abrir ajustes" aria-label="Abrir ajustes" data-nav="settings">⚙</button><button class="primary-button top-add" type="button" data-action="quick-add">＋ Agregar</button></div>
      </header>
      <main id="view" class="page-content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navegación móvil">
    <button type="button" class="mobile-item active" data-nav="dashboard"><span>◫</span>Inicio</button>
    <button type="button" class="mobile-item" data-nav="finance"><span>◈</span>Dinero</button>
    <button type="button" class="mobile-item" data-nav="planner"><span>▦</span>Agenda</button>
    <button type="button" class="mobile-item" data-nav="nutrition"><span>♡</span>Comidas</button>
    <button type="button" class="mobile-item" data-nav="notes"><span>▤</span>Notas</button>
  </nav>

  <div id="modal-layer" class="modal-layer" hidden aria-hidden="true"><div class="modal-backdrop" data-action="close-modal"></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title">Nuevo registro</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Cerrar">✕</button></div><div id="modal-body"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
